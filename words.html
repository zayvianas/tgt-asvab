<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0912">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Word Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Karla:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root{
    --bg:#f4f2ef; --card:#ffffff; --card-2:#12101a; --ink:#171322; --ink-2:#5d5870; --line:#e0dcd6;
    --accent:#5b3df5; --accent-soft:#ece8ff; --know:#1c7a52; --know-soft:#dcf5e9; --again:#a35a06; --again-soft:#fbeedd;
    --onDark:#f6f4ff; --onDark-2:#a9a2c6; --darkline:#2b2640;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0912; --card:#171325; --card-2:#221c39; --ink:#f3f1fb; --ink-2:#a49dc2; --line:#2b2540;
      --accent:#a693ff; --accent-soft:#241d3d; --know:#57d3a0; --know-soft:#123227; --again:#e7a75a; --again-soft:#33250f;
      --onDark:#f6f4ff; --onDark-2:#a9a2c6; --darkline:#39325a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0912; --card:#171325; --card-2:#221c39; --ink:#f3f1fb; --ink-2:#a49dc2; --line:#2b2540;
    --accent:#a693ff; --accent-soft:#241d3d; --know:#57d3a0; --know-soft:#123227; --again:#e7a75a; --again-soft:#33250f;
    --onDark:#f6f4ff; --onDark-2:#a9a2c6; --darkline:#39325a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;overflow:hidden}
  .app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px}

  header{padding-block:12px 8px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-family:Outfit,sans-serif;font-weight:900;font-size:20px;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  .count{font-family:Outfit,sans-serif;font-weight:700;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;font-family:Outfit,sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;padding:6px 13px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .chip[aria-pressed="true"]{color:#12101a}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#12101a}}

  .feed{flex:1 1 auto;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -4px}
  .feed::-webkit-scrollbar{display:none}
  .slot{height:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:8px 4px 14px;display:flex}

  .card{position:relative;flex:1;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.8,.35,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;overflow:hidden}
  .front{background:var(--card);border:1.5px solid var(--line);align-items:flex-start;justify-content:flex-start;gap:14px}
  .front .word{margin-top:auto}
  .front .pos{margin-bottom:auto}
  .back{background:var(--card-2);color:var(--onDark);transform:rotateY(180deg);gap:12px;overflow-y:auto}

  .lvl{font-family:Outfit,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1.5px solid currentColor}
  .lvl.easy{color:var(--know)} .lvl.medium{color:var(--accent)} .lvl.hard{color:var(--again)}
  .word{font-family:Outfit,sans-serif;font-weight:900;font-size:clamp(38px,11vw,62px);line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
  .pos{font-style:italic;color:var(--ink-2);margin:0}
  .prompt{margin-top:auto;font-family:Outfit,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .status{position:absolute;top:18px;right:18px;font-family:Outfit,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
  .status.know{background:var(--know-soft);color:var(--know)}
  .status.again{background:var(--again-soft);color:var(--again)}

  .back h3{font-family:Outfit,sans-serif;font-weight:900;font-size:26px;margin:0;letter-spacing:-.02em}
  .lab{font-family:Outfit,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--onDark-2);margin:0 0 2px}
  .blk{border-top:1px solid var(--darkline);padding-top:10px}
  .blk p{margin:0}
  .mean{font-size:18px;font-weight:600}
  .roots{color:var(--onDark);font-size:15px}
  .roots b{color:#c3b6ff;font-weight:600}
  .sent{font-style:italic;color:var(--onDark)}
  .sent em{font-style:normal;background:rgba(166,147,255,.22);border-radius:4px;padding:0 3px}
  .pair{display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:13.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--darkline)}
  .tag.s{color:#9ff0c9} .tag.a{color:#ffc78a}
  .hook{background:rgba(166,147,255,.14);border-left:3px solid #a693ff;border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
  .marks{margin-top:auto;display:flex;gap:10px;padding-top:12px}
  .marks button{flex:1;font-family:Outfit,sans-serif;font-weight:700;font-size:15px;padding:12px 8px;border-radius:12px;border:1.5px solid var(--darkline);background:transparent;color:var(--onDark);cursor:pointer}
  .marks button.got{background:var(--know);border-color:var(--know);color:#07130e}
  .marks button.rev{background:var(--again);border-color:var(--again);color:#231502}
  button:focus-visible,.card:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}

  .end{background:var(--card);border:1.5px dashed var(--line);border-radius:22px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;flex:1;text-align:center}
  .end h3{font-family:Outfit,sans-serif;font-weight:900;font-size:28px;margin:0}
  .end p{margin:0;color:var(--ink-2)}
  .end button{font-family:Outfit,sans-serif;font-weight:700;font-size:15px;padding:12px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  :root[data-theme="dark"] .end button{color:#12101a}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .end button{color:#12101a}}
  .empty{color:var(--ink-2);text-align:center;padding:40px 10px}
  @media (prefers-reduced-motion:reduce){.inner{transition:none}}

  .home{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:17px;line-height:1}
  .app{padding-top:0}
  header .brand{margin-left:40px}
</style>

</head>
<body>
<a href="index.html" class="home" aria-label="Back to all decks">&#8592;</a>
<div class="app">
  <header>
    <div class="toprow">
      <div class="brand">Word<span>Deck</span></div>
      <div class="count" id="count">0 of 0</div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">All 250</button>
      <button class="chip" data-f="easy" aria-pressed="false">Easy</button>
      <button class="chip" data-f="medium" aria-pressed="false">Medium</button>
      <button class="chip" data-f="hard" aria-pressed="false">Hard</button>
      <button class="chip" data-f="review" aria-pressed="false">Review pile</button>
      <button class="chip" id="shuffle" aria-pressed="false">Shuffle</button>
    </div>
  </header>
  <div class="feed" id="feed"></div>
</div>

<script>
(function(){
  "use strict";
  var WORDS = [{"w": "rapid","p": "adjective","l": "easy","r": "Latin <b>rapidus</b>, from <b>rapere</b> (to seize, snatch away)","m": "Very fast.","s": "The rapid current pulled the raft downstream.","syn": ["quick","swift"],"ant": "slow","h": "River rapids move fast."},{"w": "assist","p": "verb","l": "easy","r": "Latin <b>assistere</b> = <b>ad</b> (to) + <b>sistere</b> (to stand)","m": "To help someone.","s": "A neighbor stopped to assist with the flat tire.","syn": ["help","aid"],"ant": "hinder","h": "An assistant stands beside you to help."},{"w": "vacant","p": "adjective","l": "easy","r": "Latin <b>vacare</b> (to be empty)","m": "Empty; not being used.","s": "The apartment had been vacant for three months.","syn": ["empty","unoccupied"],"ant": "occupied","h": "A motel's VACANCY sign means empty rooms."},{"w": "cautious","p": "adjective","l": "easy","r": "Latin <b>cavere</b> (to beware)","m": "Careful about avoiding danger or mistakes.","s": "She was cautious on the icy steps.","syn": ["careful","wary"],"ant": "reckless","h": "Caution tape tells you to be careful."},{"w": "abundant","p": "adjective","l": "easy","r": "Latin <b>abundare</b> (to overflow) = <b>ab</b> (off) + <b>unda</b> (wave)","m": "More than enough; plentiful.","s": "Water was abundant after the spring rains.","syn": ["plentiful","ample"],"ant": "scarce","h": "Waves and waves of it, overflowing."},{"w": "conceal","p": "verb","l": "easy","r": "Latin <b>concelare</b> = <b>com</b> (completely) + <b>celare</b> (to hide)","m": "To hide something.","s": "He tried to conceal his surprise.","syn": ["hide","cover"],"ant": "reveal","h": "The root celare means hide, like a hidden cellar."},{"w": "fragile","p": "adjective","l": "easy","r": "Latin <b>fragilis</b>, from <b>frangere</b> (to break)","m": "Easily broken or damaged.","s": "The box was marked fragile.","syn": ["delicate","breakable"],"ant": "sturdy","h": "Same root as fracture."},{"w": "hesitate","p": "verb","l": "easy","r": "Latin <b>haesitare</b> (to stick fast, to be stuck)","m": "To pause before doing something, usually out of doubt.","s": "She hesitated before signing.","syn": ["pause","waver"],"ant": "rush","h": "You get stuck for a second."},{"w": "diligent","p": "adjective","l": "easy","r": "Latin <b>diligere</b> (to value highly, take care over)","m": "Hardworking and careful.","s": "A diligent student finishes every assignment.","syn": ["industrious","thorough"],"ant": "lazy","h": "You care about the work, so you do it well."},{"w": "reluctant","p": "adjective","l": "easy","r": "Latin <b>reluctari</b> = <b>re</b> (against) + <b>luctari</b> (to struggle)","m": "Unwilling; holding back.","s": "He was reluctant to volunteer for the early shift.","syn": ["hesitant","unwilling"],"ant": "eager","h": "You're wrestling against doing it."},{"w": "vital","p": "adjective","l": "easy","r": "Latin <b>vita</b> (life)","m": "Absolutely necessary.","s": "Water is vital for survival.","syn": ["essential","crucial"],"ant": "optional","h": "Vital signs are life signs."},{"w": "obtain","p": "verb","l": "easy","r": "Latin <b>obtinere</b> = <b>ob</b> (toward) + <b>tenere</b> (to hold)","m": "To get or acquire something.","s": "You must obtain a permit before building.","syn": ["acquire","secure"],"ant": "lose","h": "You reach out and hold onto it."},{"w": "durable","p": "adjective","l": "easy","r": "Latin <b>durare</b> (to last, to harden)","m": "Built to last a long time.","s": "These boots are durable enough for daily work.","syn": ["long-lasting","tough"],"ant": "flimsy","h": "Same root as endure."},{"w": "summit","p": "noun","l": "easy","r": "Latin <b>summus</b> (highest)","m": "The highest point of something.","s": "They reached the summit before noon.","syn": ["peak","top"],"ant": "base","h": "A sum is the top line of the math; summit is the top of the mountain."},{"w": "prohibit","p": "verb","l": "easy","r": "Latin <b>prohibere</b> = <b>pro</b> (in front) + <b>habere</b> (to hold)","m": "To forbid something by rule or law.","s": "The signs prohibit parking after 6 p.m.","syn": ["forbid","ban"],"ant": "permit","h": "You're held back from doing it."},{"w": "candid","p": "adjective","l": "medium","r": "Latin <b>candidus</b> (white, pure, sincere)","m": "Honest and direct, even when it's awkward.","s": "She gave a candid answer about what went wrong.","syn": ["frank","open"],"ant": "evasive","h": "A candid photo is unposed, the real thing."},{"w": "obsolete","p": "adjective","l": "medium","r": "Latin <b>obsolescere</b> (to fall into disuse)","m": "Out of date; no longer used.","s": "Fax machines are nearly obsolete.","syn": ["outdated","antiquated"],"ant": "current","h": "It fell out of use."},{"w": "impartial","p": "adjective","l": "medium","r": "Latin <b>im</b> (not) + <b>partialis</b> (of a part, favoring a side)","m": "Fair; not favoring either side.","s": "A judge must remain impartial.","syn": ["unbiased","neutral"],"ant": "biased","h": "Not taking anybody's part."},{"w": "tedious","p": "adjective","l": "medium","r": "Latin <b>taedium</b> (weariness, disgust)","m": "Boring because it's long and repetitive.","s": "Counting inventory by hand is tedious.","syn": ["dull","monotonous"],"ant": "engaging","h": "Tedium is boredom; tedious things cause it."},{"w": "meticulous","p": "adjective","l": "medium","r": "Latin <b>meticulosus</b> (fearful), from <b>metus</b> (fear)","m": "Extremely careful about details.","s": "His meticulous notes made the audit easy.","syn": ["painstaking","precise"],"ant": "sloppy","h": "So careful it's almost like you're afraid to miss something."},{"w": "scarce","p": "adjective","l": "medium","r": "Latin <b>excarpere</b> (to pluck out), through Old French","m": "Not enough of it; hard to find.","s": "Fresh produce is scarce in that neighborhood.","syn": ["sparse","limited"],"ant": "abundant","h": "Scarce and abundant are opposites, and the test loves that pair."},{"w": "deteriorate","p": "verb","l": "medium","r": "Latin <b>deterior</b> (worse)","m": "To get worse over time.","s": "The roof deteriorated after years without repair.","syn": ["decline","worsen"],"ant": "improve","h": "deter- means worse."},{"w": "adamant","p": "adjective","l": "medium","r": "Greek <b>adamas</b> (unbreakable), the same root as diamond","m": "Refusing to change your mind.","s": "She was adamant that the shift start on time.","syn": ["unyielding","insistent"],"ant": "flexible","h": "Hard as a diamond about it."},{"w": "concise","p": "adjective","l": "medium","r": "Latin <b>concidere</b> = <b>com</b> (completely) + <b>caedere</b> (to cut)","m": "Short and clear, with nothing extra.","s": "Her explanation was concise, just two sentences.","syn": ["brief","succinct"],"ant": "rambling","h": "Everything unnecessary got cut."},{"w": "impede","p": "verb","l": "medium","r": "Latin <b>impedire</b> = <b>in</b> (in) + <b>pes</b> (foot), literally to shackle the feet","m": "To slow down or block progress.","s": "Heavy rain impeded the crew's work.","syn": ["hinder","obstruct"],"ant": "assist","h": "Your feet are tangled, so you can't move."},{"w": "prudent","p": "adjective","l": "medium","r": "Latin <b>prudens</b> (foreseeing, wise)","m": "Sensible and careful about the future.","s": "It was prudent to check the tires before the drive.","syn": ["sensible","judicious"],"ant": "rash","h": "You see the problem coming and avoid it."},{"w": "conclusive","p": "adjective","l": "medium","r": "Latin <b>concludere</b> = <b>com</b> (together) + <b>claudere</b> (to close)","m": "Settling the question for good.","s": "The evidence was conclusive, and the debate ended.","syn": ["decisive","definitive"],"ant": "inconclusive","h": "It closes the case."},{"w": "diminish","p": "verb","l": "medium","r": "Latin <b>deminuere</b> (to make smaller), related to <b>minus</b>","m": "To make or become smaller or less.","s": "Fresh batteries diminish the chance of a false alarm.","syn": ["reduce","lessen"],"ant": "increase","h": "minus means less."},{"w": "apprehensive","p": "adjective","l": "medium","r": "Latin <b>apprehendere</b> (to seize, to grasp)","m": "Nervous about something coming up.","s": "She was apprehensive about the timed test.","syn": ["anxious","uneasy"],"ant": "confident","h": "The worry grabs hold of you."},{"w": "explicit","p": "adjective","l": "medium","r": "Latin <b>explicitus</b> = <b>ex</b> (out) + <b>plicare</b> (to fold), so unfolded","m": "Stated clearly and directly, leaving no doubt.","s": "The instructions were explicit: no phones on the range.","syn": ["clear","direct"],"ant": "implied","h": "Unfolded so you can see all of it."},{"w": "ambiguous","p": "adjective","l": "hard","r": "Latin <b>ambiguus</b> = <b>ambi</b> (both ways) + <b>agere</b> (to drive)","m": "Unclear because it could mean more than one thing.","s": "The directions were so ambiguous that nobody knew which way to go.","syn": ["vague","unclear"],"ant": "clear","h": "ambi means both, like ambidextrous. It goes both ways."},{"w": "tenacious","p": "adjective","l": "hard","r": "Latin <b>tenax</b> (holding fast), from <b>tenere</b> (to hold)","m": "Refusing to let go or give up.","s": "Her tenacious studying paid off.","syn": ["persistent","dogged"],"ant": "yielding","h": "Same root as tenant, someone holding a place."},{"w": "benevolent","p": "adjective","l": "hard","r": "Latin <b>bene</b> (well) + <b>velle</b> (to wish)","m": "Kind; wishing good for others.","s": "A benevolent donor paid for the new field.","syn": ["kindly","generous"],"ant": "malevolent","h": "bene is good and mal is bad. Benevolent and malevolent are exact opposites."},{"w": "arduous","p": "adjective","l": "hard","r": "Latin <b>arduus</b> (steep, high)","m": "Very hard and demanding.","s": "Basic training is arduous by design.","syn": ["grueling","strenuous"],"ant": "effortless","h": "Picture a steep climb."},{"w": "candor","p": "noun","l": "hard","r": "Latin <b>candor</b> (brightness, sincerity), same root as candid","m": "Honest, open speech.","s": "He answered with unusual candor.","syn": ["frankness","directness"],"ant": "deceit","h": "If you know candid, you know candor. It's the noun form."},{"w": "mitigate","p": "verb","l": "hard","r": "Latin <b>mitigare</b> = <b>mitis</b> (mild) + <b>agere</b> (to make)","m": "To make something less severe.","s": "Sandbags mitigated the flooding.","syn": ["ease","lessen"],"ant": "aggravate","h": "You make the situation milder."},{"w": "innocuous","p": "adjective","l": "hard","r": "Latin <b>in</b> (not) + <b>nocere</b> (to harm)","m": "Harmless.","s": "The snake looked frightening but was innocuous.","syn": ["harmless","benign"],"ant": "harmful","h": "Noxious means harmful; in- flips it to harmless."},{"w": "laconic","p": "adjective","l": "hard","r": "Greek <b>Lakonikos</b>, of Laconia (Sparta), whose people were famous for saying little","m": "Using very few words.","s": "His laconic reply was just “understood.”","syn": ["terse","brief"],"ant": "wordy","h": "Spartans were famously short on words."},{"w": "ubiquitous","p": "adjective","l": "hard","r": "Latin <b>ubique</b> (everywhere)","m": "Found everywhere; seemingly everywhere at once.","s": "Phones are ubiquitous on any campus.","syn": ["omnipresent","pervasive"],"ant": "rare","h": "ubi means where; ubique means everywhere."},{"w": "austere","p": "adjective","l": "hard","r": "Greek <b>austeros</b> (harsh, dry)","m": "Plain and severe, without comfort or decoration.","s": "The barracks were clean but austere.","syn": ["stark","spare"],"ant": "lavish","h": "An austere room has nothing extra in it."},{"w": "ameliorate","p": "verb","l": "hard","r": "Latin <b>melior</b> (better)","m": "To make a bad situation better.","s": "The new schedule ameliorated the staffing shortage.","syn": ["improve","relieve"],"ant": "worsen","h": "melior means better, as in meliorate."},{"w": "obstinate","p": "adjective","l": "hard","r": "Latin <b>obstinare</b> (to stand firm, persist)","m": "Stubborn; refusing to change course.","s": "He was obstinate about taking the long route.","syn": ["stubborn","headstrong"],"ant": "compliant","h": "Standing there, refusing to move."},{"w": "pragmatic","p": "adjective","l": "hard","r": "Greek <b>pragma</b> (deed, action)","m": "Practical; focused on what actually works.","s": "She took a pragmatic approach and fixed the cheapest problem first.","syn": ["practical","realistic"],"ant": "idealistic","h": "About action, not theory."},{"w": "lucid","p": "adjective","l": "hard","r": "Latin <b>lucidus</b> (bright, clear), from <b>lux</b> (light)","m": "Clear and easy to understand.","s": "He gave a lucid explanation of the rules.","syn": ["clear","coherent"],"ant": "confusing","h": "Light on the subject, so you can see it."},{"w": "vindicate","p": "verb","l": "hard","r": "Latin <b>vindicare</b> (to claim, to avenge)","m": "To clear someone of blame, or to prove them right.","s": "The video vindicated her account of the accident.","syn": ["exonerate","justify"],"ant": "accuse","h": "The evidence takes your side."},{"w": "alter","p": "verb","l": "easy","r": "Latin <b>alter</b> (the other)","m": "To change something.","s": "They altered the schedule after the storm.","syn": ["change","modify"],"ant": "keep","h": "An alternate route is the other route."},{"w": "ample","p": "adjective","l": "easy","r": "Latin <b>amplus</b> (large, roomy)","m": "More than enough.","s": "There was ample room in the truck.","syn": ["plenty","generous"],"ant": "insufficient","h": "To amplify is to make bigger."},{"w": "barren","p": "adjective","l": "easy","r": "Old French <b>baraigne</b> (sterile)","m": "Empty; producing nothing.","s": "Nothing grew in the barren field.","syn": ["bare","empty"],"ant": "fertile","h": "A barren field is bare."},{"w": "blunt","p": "adjective","l": "easy","r": "Old Norse <b>blunda</b> (to shut the eyes)","m": "Not sharp; or saying things very directly.","s": "His blunt reply surprised everyone.","syn": ["direct","dull"],"ant": "tactful","h": "A blunt knife and a blunt comment both lack a fine ": "To raise something up.","s": "Elevate the leg to reduce swelling.","syn": ["raise","lift"],"ant": "lower","h": "An elevator lifts you."},{"w": "endure","p": "verb","l": "easy","r": "Latin <b>indurare</b> (to harden, <b>durus</b> hard)","m": "To last a long time, or to put up with something hard.","s": "The bridge endured decades of traffic.","syn": ["withstand","last"],"ant": "surrender","h": "Same root as durable."},{"w": "erode","p": "verb","l": "easy","r": "Latin <b>erodere</b> (to gnaw away)","m": "To wear away slowly.","s": "The river eroded the bank.","syn": ["wear away","eat away"],"ant": "build up","h": "Water gnawing at the rock."},{"w": "evident","p": "adjective","l": "easy","r": "Latin <b>evidens</b> (clearly seen, from <b>videre</b> to see)","m": "Easy to see or understand.","s": "His relief was evident.","syn": ["obvious","apparent"],"ant": "hidden","h": "Evidence is what you can see."},{"w": "exceed","p": "verb","l": "easy","r": "Latin <b>excedere</b> = <b>ex</b> (out) + <b>cedere</b> (to go)","m": "To go beyond a limit.","s": "Do not exceed the posted speed.","syn": ["surpass","top"],"ant": "fall short","h": "You go out past the line."},{"w": "expand","p": "verb","l": "easy","r": "Latin <b>expandere</b> (to spread out)","m": "To get bigger or spread out.","s": "Metal expands in heat.","syn": ["enlarge","grow"],"ant": "shrink","h": "Spread out wide."},{"w": "feeble","p": "adjective","l": "easy","r": "Latin <b>flebilis</b> (to be wept over)","m": "Weak.","s": "The flashlight gave a feeble glow.","syn": ["weak","frail"],"ant": "strong","h": "So weak it's sad."},{"w": "flaw","p": "noun","l": "easy","r": "Old Norse <b>flaga</b> (a slab, a chip)","m": "A fault or imperfection.","s": "One flaw in the weld caused the leak.","syn": ["defect","fault"],"ant": "perfection","h": "A chip in something otherwise solid."},{"w": "frank","p": "adjective","l": "easy","r": "Old French <b>franc</b> (free, sincere)","m": "Honest and direct.","s": "To be frank, the plan omething.","s": "Neighbors opposed the new road.","syn": ["resist","object to"],"ant": "support","h": "You place yourself against it."},{"w": "peril","p": "noun","l": "easy","r": "Latin <b>periculum</b> (danger, trial)","m": "Serious danger.","s": "The climbers were in real peril.","syn": ["danger","risk"],"ant": "safety","h": "Perilous roads are dangerous roads."},{"w": "persist","p": "verb","l": "easy","r": "Latin <b>persistere</b> = <b>per</b> (through) + <b>sistere</b> (to stand)","m": "To keep going despite difficulty.","s": "He persisted until the engine started.","syn": ["continue","endure"],"ant": "quit","h": "You stand through it."},{"w": "portion","p": "noun","l": "easy","r": "Latin <b>portio</b> (share, part)","m": "A part or share of something.","s": "A portion of the payment is due now.","syn": ["share","part"],"ant": "whole","h": "A portion of food is your share."},{"w": "postpone","p": "verb","l": "easy","r": "Latin <b>postponere</b> = <b>post</b> (after) + <b>ponere</b> (to place)","m": "To move something to a later time.","s": "They postponed the game until Sunday.","syn": ["delay","put off"],"ant": "advance","h": "You place it after where it was."},{"w": "precise","p": "adjective","l": "easy","r": "Latin <b>praecisus</b> (cut short, exact)","m": "Exact and accurate.","s": "Give me the precise measurement.","syn": ["exact","accurate"],"ant": "vague","h": "Cut to the exact size."},{"w": "primary","p": "adjective","l": "easy","r": "Latin <b>primus</b> (first)","m": "Main or first in importance.","s": "Safety is the primary concern.","syn": ["chief","main"],"ant": "secondary","h": "prim means first, as in primitive."},{"w": "rare","p": "adjective","l": "easy","r": "Latin <b>rarus</b> (thinly spread, uncommon)","m": "Not found often.","s": "Snow is rare in this county.","syn": ["scarce","uncommon"],"ant": "common","h": "Thinly spread, so hard to find."},{"w": "recall","p": "verb","l": "easy","r": "Latin <b>re</b> (back) + <b>calare</b> (to call)","m": " pure, clean, unmixed)","m": "Honest and genuine, not faked.","s": "His apology sounded sincere.","syn": ["genuine","heartfelt"],"ant": "fake","h": "Pure, with nothing mixed in."},{"w": "solitary","p": "adjective","l": "easy","r": "Latin <b>solus</b> (alone)","m": "Alone; single.","s": "A solitary light burned in the window.","syn": ["lone","isolated"],"ant": "accompanied","h": "sol means alone, as in solo."},{"w": "sturdy","p": "adjective","l": "easy","r": "Old French <b>estourdi</b> (reckless, then firm)","m": "Strongly built.","s": "The ladder felt sturdy under his weight.","syn": ["solid","robust"],"ant": "flimsy","h": "Sturdy holds, flimsy folds."},{"w": "tidy","p": "adjective","l": "easy","r": "Middle English <b>tidy</b> (timely, in good order)","m": "Neat and in order.","s": "She kept a tidy workspace.","syn": ["neat","orderly"],"ant": "messy","h": "Everything in its place."},{"w": "vague","p": "adjective","l": "easy","r": "Latin <b>vagus</b> (wandering)","m": "Unclear; not specific.","s": "His directions were too vague to follow.","syn": ["unclear","fuzzy"],"ant": "specific","h": "The meaning wanders instead of landing."},{"w": "wary","p": "adjective","l": "easy","r": "Old English <b>waer</b> (aware, watchful)","m": "Careful because of possible danger.","s": "She was wary of the icy steps.","syn": ["cautious","guarded"],"ant": "trusting","h": "Beware and wary come from the same watchfulness."},{"w": "abate","p": "verb","l": "medium","r": "Old French <b>abatre</b> (to beat down)","m": "To become less intense.","s": "The wind abated after midnight.","syn": ["subside","ease"],"ant": "intensify","h": "The storm gets beaten down."},{"w": "abstain","p": "verb","l": "medium","r": "Latin <b>abstinere</b> = <b>abs</b> (from) + <b>tenere</b> (to hold)","m": "To choose not to do something.","s": "Two members abstained from the vote.","syn": ["refrain","hold back"],"ant": "indulge","h": "You hold yourself back from it."},{"w": "acute","p": "adjective","l": "medium","r": "Latin <b>acutus</b> (sharpened)","m": "Sharp, severe, or very perceptive.","s": "She had an acute sense of smell.","syn": ["sharp","keen"],"ant": "dull","h": "An acute angle is a sharp one."},{"w": "adhere","p": "verb","l": "medium","r": "Latin <b>adhaerere</b> = <b>ad</b> (to) + <b>haerere</b> (to stick)","m": "To stick to something, or to follow a rule closely.","s": "Crews must adhere to the safety checklist.","syn": ["stick","follow"],"ant": "detach","h": "Adhesive tape sticks."},{"w": "adverse","p": "adjective","l": "medium","r": "Latin <b>adversus</b> (turned against)","m": "Harmful or unfavorable.","s": "The drug had adverse side effects.","syn": ["unfavorable","harmful"],"ant": "favorable","h": "Turned against you."},{"w": "affluent","p": "adjective","l": "medium","r": "Latin <b>affluere</b> (to flow toward, in abundance)","m": "Wealthy.","s": "They moved to a more affluent neighborhood.","syn": ["wealthy","prosperous"],"ant": "impoverished","h": "Money flowing toward you."},{"w": "alleviate","p": "verb","l": "medium","r": "Latin <b>alleviare</b> (to lighten, from <b>levis</b> light)","m": "To make pain or a problem less severe.","s": "Ice alleviated the swelling.","syn": ["relieve","ease"],"ant": "worsen","h": "It lightens the load."},{"w": "ambivalent","p": "adjective","l": "medium","r": "Latin <b>ambi</b> (both) + <b>valentia</b> (strength)","m": "Having mixed feelings about something.","s": "She felt ambivalent about moving away.","syn": ["torn","conflicted"],"ant": "certain","h": "Pulled with equal strength both ways."},{"w": "amend","p": "verb","l": "medium","r": "Latin <b>emendare</b> (to correct a fault)","m": "To change something in order to improve it.","s": "They amended the policy after the complaint.","syn": ["revise","correct"],"ant": "worsen","h": "To make amends is to fix things."},{"w": "anticipate","p": "verb","l": "medium","r": "Latin <b>anticipare</b> (to take before)","m": "To expect something and get ready for it.","s": "Anticipate heavy traffic after the game.","syn": ["expect","foresee"],"ant": "overlook","h": "You take it into account ahead of time."},{"w": "apathy","p": "noun","l": "medium","r": "Greek <b>a</b> (without) + <b>pathos</b> (feeling)","m": "A lack of interest or caring.","s": "Voter apathy kept turnout low.","syn": ["indifference","disinterest"],"ant": "enthusiasm","h": "Without feeling. Sympathy shares the pathos root."},{"w": "arbitrary","p": "adjective","l": "medium","r": "Latin <b>arbitrarius</b> (depending on a judge's whim)","m": "Based on personal whim rather than reason.","s": "The cutoff felt arbitrary.","syn": ["random","whimsical"],"ant": "reasoned","h": "One person decided, for no stated reason."},{"w": "articulate","p": "adjective","l": "medium","r": "Latin <b>articulare</b> (to divide into joints, to speak distinctly)","m": "Able to express ideas clearly.","s": "She was articulate under pressure.","syn": ["eloquent","well-spoken"],"ant": "tongue-tied","h": "The words come out in clear, separate joints."},{"w": "assess","p": "verb","l": "medium","r": "Latin <b>assidere</b> (to sit beside, as a judge did)","m": "To judge the value, size, or quality of something.","s": "The adjuster assessed the damage.","syn": ["evaluate","appraise"],"ant": "guess","h": "A judge sits beside the case and decides."},{"w": "avert","p": "verb","l": "medium","r": "Latin <b>avertere</b> = <b>ab</b> (away) + <b>vertere</b> (to turn)","m": "To prevent something, or to turn away.","s": "Quick thinking averted a crash.","syn": ["prevent","avoid"],"ant": "cause","h": "You turn the danger away."},{"w": "bias","p": "noun","l": "medium","r": "Old French <b>biais</b> (slant, at an angle)","m": "A leaning for or against something that gets in the way of fairness.","s": "The study was criticized for bias.","syn": ["prejudice","slant"],"ant": "fairness","h": "The whole thing tilts one way."},{"w": "brevity","p": "noun","l": "medium","r": "Latin <b>brevis</b> (short)","m": "Shortness, especially in speech or writing.","s": "He valued brevity in reports.","syn": ["conciseness","shortness"],"ant": "wordiness","h": "An abbreviation is a shortened word."},{"w": "coherent","p": "adjective","l": "medium","r": "Latin <b>cohaerere</b> (to stick together)","m": "Clear and logically connected.","s": "She gave a coherent account of the night.","syn": ["logical","consistent"],"ant": "disjointed","h": "The parts stick together."},{"w": "competent","p": "adjective","l": "medium","r": "Latin <b>competere</b> (to be suitable)","m": "Having enough skill to do the job.","s": "A competent mechanic can fix it in an hour.","syn": ["capable","skilled"],"ant": "incompetent","h": "Suited to the task."},{"w": "comply","p": "verb","l": "medium","r": "Latin <b>complere</b> (to fulfill, complete)","m": "To do what a rule or request requires.","s": "Drivers must comply with the new limit.","syn": ["obey","follow"],"ant": "defy","h": "You fulfill what was asked."},{"w": "compromise","p": "noun","l": "medium","r": "Latin <b>compromittere</b> (to promise mutually)","m": "A settlement where each side gives something up.","s": "They reached a compromise on the schedule.","syn": ["agreement","middle ground"],"ant": "stalemate","h": "Both sides promise something."},{"w": "conform","p": "verb","l": "medium","r": "Latin <b>conformare</b> (to shape, to form with)","m": "To follow the usual standard or rule.","s": "The wiring must conform to code.","syn": ["comply","fit in"],"ant": "deviate","h": "Shaped to match the form."},{"w": "consensus","p": "noun","l": "medium","r": "Latin <b>consentire</b> (to feel together)","m": "General agreement in a group.","s": "The team reached a consensus quickly.","syn": ["agreement","accord"],"ant": "disagreement","h": "Everyone feels the same way about it."},{"w": "contempt","p": "noun","l": "medium","r": "Latin <b>contemnere</b> (to scorn, to slight)","m": "A feeling that someone or something is worthless.","s": "He spoke of the rules with contempt.","syn": ["scorn","disdain"],"ant": "respect","h": "Looking down on something."},{"w": "credible","p": "adjective","l": "medium","r": "Latin <b>credere</b> (to believe)","m": "Believable; worth trusting.","s": "The witness was credible.","syn": ["believable","reliable"],"ant": "dubious","h": "Credit, creed and credible all come from believing."},{"w": "curtail","p": "verb","l": "medium","r": "Latin <b>curtus</b> (shortened)","m": "To cut something short or reduce it.","s": "They curtailed the trip when funds ran low.","syn": ["shorten","cut back"],"ant": "extend","h": "Curt means short, and so does this."},{"w": "decisive","p": "adjective","l": "medium","r": "Latin <b>decidere</b> (to cut off, to settle)","m": "Settling the matter, or able to decide quickly.","s": "Her decisive call saved the mission.","syn": ["conclusive","firm"],"ant": "hesitant","h": "The question gets cut off, settled."},{"w": "deficit","p": "noun","l": "medium","r": "Latin <b>deficere</b> (to fail, to fall short)","m": "A shortage, especially of money.","s": "The budget ran a deficit this year.","syn": ["shortfall","gap"],"ant": "surplus","h": "Deficient means lacking; a deficit is what's missing."},{"w": "deplete","p": "verb","l": "medium","r": "Latin <b>deplere</b> (to empty out)","m": "To use up a supply.","s": "The drought depleted the reservoir.","syn": ["drain","exhaust"],"ant": "replenish","h": "Emptied out."},{"w": "deter","p": "verb","l": "medium","r": "Latin <b>deterrere</b> (to frighten away, from <b>terrere</b> to scare)","m": "To discourage someone from doing something.","s": "Cameras deter theft.","syn": ["discourage","prevent"],"ant": "encourage","h": "Terror scares you off."},{"w": "discreet","p": "adjective","l": "medium","r": "Latin <b>discretus</b> (separated, careful in judgment)","m": "Careful not to say too much.","s": "Be discreet about the transfer until it's official.","syn": ["tactful","private"],"ant": "indiscreet","h": "You keep some things separate from the conversation."},{"w": "dis b> back)","m": "To publicly support or approve.","s": "The union endorsed the plan.","syn": ["support","back"],"ant": "oppose","h": "You sign the back of it."},{"w": "enhance","p": "verb","l": "medium","r": "Old French <b>enhaucier</b> (to raise, make higher)","m": "To improve or add to the quality of something.","s": "Better lighting enhanced the photos.","syn": ["improve","boost"],"ant": "diminish","h": "It raises the level."},{"w": "erratic","p": "adjective","l": "medium","r": "Latin <b>errare</b> (to wander, to stray)","m": "Unpredictable; not steady.","s": "The engine idled in an erratic rhythm.","syn": ["inconsistent","unpredictable"],"ant": "steady","h": "Same root as error: it wanders off course."},{"w": "exempt","p": "adjective","l": "medium","r": "Latin <b>eximere</b> (to take out)","m": "Free from a rule others must follow.","s": "Emergency vehicles are exempt from the limit.","syn": ["excused","immune"],"ant": "liable","h": "Taken out of the group that has to comply."},{"w": "feasible","p": "adjective","l": "medium","r": "Old French <b>faisable</b>, from Latin <b>facere</b> (to do)","m": "Possible to do.","s": "A two-day repair is feasible.","syn": ["doable","workable"],"ant": "impossible","h": "It can be done."},{"w": "fluctuate","p": "verb","l": "medium","r": "Latin <b>fluctuare</b> (to move like waves, from <b>fluctus</b> wave)","m": "To rise and fall irregularly.","s": "Prices fluctuate with the season.","syn": ["vary","waver"],"ant": "stabilize","h": "It moves in waves."},{"w": "fortify","p": "verb","l": "medium","r": "Latin <b>fortis</b> (strong) + <b>facere</b> (to make)","m": "To strengthen.","s": "Sandbags fortified the levee.","syn": ["strengthen","reinforce"],"ant": "weaken","h": "A fort is a strengthened place."},{"w": "futile","p": "adjective","l": "medium","r": "Latin <b>futilis</b> (leaky, worthless)","m": "Pointless; having no chance of success.","s": "Arguing with the machine was futile.","syn": ["useless","vain"],"ant": "effective","h": "Like carrying water in a leaky bucket."},{"w": "hostile","p": "adjective","l": "medium","r": "Latin <b>hostis</b> (enemy)","m": "Unfriendly or aggressive.","s": "The crowd turned hostile.","syn": ["aggressive","antagonistic"],"ant": "friendly","h": "Treating you like an enemy."},{"w": "illicit","p": "adjective","l": "medium","r": "Latin <b>illicitus</b> = <b>in</b> (not) + <b>licitus</b> (allowed)","m": "Not allowed by law.","s": "They were charged with illicit sales.","syn": ["illegal","unlawful"],"ant": "lawful","h": "Not licensed, not allowed."},{"w": "imminent","p": "adjective","l": "medium","r": "Latin <b>imminere</b> (to overhang, to threaten)","m": "About to happen very soon.","s": "A storm was imminent.","syn": ["approaching","impending"],"ant": "distant","h": "It's hanging right over you."},{"w": "indifferent","p": "adjective","l": "medium","r": "Latin <b>indifferens</b> (making no difference)","m": "Not caring one way or the other.","s": "He was indifferent about which route they took.","syn": ["uninterested","unconcerned"],"ant": "passionate","h": "It makes no difference to you."},{"w": "inevitable","p": "adjective","l": "medium","r": "Latin <b>inevitabilis</b> = <b>in</b> (not) + <b>evitare</b> (to avoid)","m": "Certain to happen; unavoidable.","s": "With no maintenance, failure was inevitable.","syn": ["unavoidable","certain"],"ant": "avoidable","h": "You cannot avoid it."},{"w": "innovate","p": "verb","l": "medium","r": "Latin <b>innovare</b> (to renew, from <b>novus</b> new)","m": "To introduce something new.","s": "Small shops often innovate faster.","syn": ["pioneer","invent"],"ant": "imitate","h": "nov means new."},{"w": "integrity","p": "noun","l": "medium","r": "Latin <b>integer</b> (whole, untouched)","m": "Honesty and strong principles; also soundness of a structure.","s": "The inspector questioned the integrity of the beam.","syn": ["honesty","soundness"],"ant": "corruption","h": "Whole, with nothing broken off. An integer is a whole number."},{"w": "intervene","p": "verb","l": "medium","r": "Latin <b>intervenire</b> = <b>inter</b> (between) + <b>venire</b> (to come)","m": "To step in to change what's happening.","s": "A bystander intervened before it escalated.","syn": ["step in","intercede"],"ant": "stand by","h": "You come between."},{"w": "lavish","p": "adjective","l": "medium","r": "Old French <b>lavasse</b> (a downpour of rain)","m": "Very generous or extravagant.","s": "They threw a lavish party.","syn": ["extravagant","opulent"],"ant": "meager","h": "It pours down like rain."},{"w": "legitimate","p": "adjective","l": "medium","r": "Latin <b>legitimus</b> (lawful, from <b>lex</b> law)","m": "Legal, genuine, or reasonable.","s": "She had a legitimate reason for the delay.","syn": ["valid","lawful"],"ant": "bogus","h": "By the book, by the law."},{"w": "mediate","p": "verb","l": "medium","r": "Latin <b>medius</b> (middle)","m": "To help two sides reach an agreement.","s": "A counselor mediated the dispute.","syn": ["arbitrate","referee"],"ant": "provoke","h": "You stand in the middle."},{"w": "novel","p": "adjective","l": "medium","r": "Latin <b>novus</b> (new)","m": "New and unusual.","s": "They tried a novel approach to the schedule.","syn": ["original","fresh"],"ant": "familiar","h": "Not the book: as an adjective it means new."},{"w": "obscure","p": "adjective","l": "medium","r": "Latin <b>obscurus</b> (dark, covered)","m": "Hard to see or understand; little known.","s": "The rule is buried in an obscure section.","syn": ["unclear","little-known"],"ant": "well-known","h": "It's in the dark."},{"w": "optimal","p": "adjective","l": "medium","r": "Latin <b>optimus</b> (best)","m": "The best possible under the circumstances.","s": "Cool and dry is the optimal storage condition.","syn": ["ideal","best"],"ant": "worst","h": "An optimist expects the best."},{"w": "plausible","p": "adjective","l": "medium","r": "Latin <b>plausibilis</b> (deserving applause), from <b>plaudere</b> (to clap)","m": "Believable, at least on the surface.","s": "His excuse was plausible but unproven.","syn": ["believable","reasonable"],"ant": "far-fetched","h": "Good enough that people would clap for it."},{"w": "provoke","p": "verb","l": "medium","r": "Latin <b>provocare</b> = <b>pro</b> (forth) + <b>vocare</b> (to call)","m": "To stir up a reaction, often anger.","s": "The comment provoked an argument.","syn": ["incite","trigger"],"ant": "soothe","h": "You call the reaction forth."},{"w": "reciprocate","p": "verb","l": "medium","r": "Latin <b>reciprocus</b> (moving back and forth)","m": "To give back something similar to what you received.","s": "She reciprocated the favor a week later.","syn": ["return","repay"],"ant": "withhold","h": "It goes back and forth."},{"w": "relevant","p": "adjective","l": "medium","r": "Latin <b>relevare</b> (to lift up, to bear upon)","m": "Connected to the matter at hand.","s": "Keep the notes relevant to the question.","syn": ["applicable","pertinent"],"ant": "unrelated","h": "It bears on what you're discussing."},{"w": "resilient","p": "adjective","l": "medium","r": "Latin <b>resilire</b> (to leap back)","m": "Able to recover quickly.","s": "Kids are resilient after a scare.","syn": ["tough","adaptable"],"ant": "fragile","h": "It springs back."},{"w": "skeptical","p": "adjective","l": "medium","r": "Greek <b>skeptikos</b> (inquiring, doubting)","m": "Doubting; not easily convinced.","s": "He was skeptical of the low estimate.","syn": ["doubtful","unconvinced"],"ant": "credulous","h": "You question it before you accept it."},{"w": "subtle","p": "adjective","l": "medium","r": "Latin <b>subtilis</b> (fine, finely woven)","m": "Slight; not obvious.","s": "There was a subtle difference in tone.","syn": ["slight","understated"],"ant": "blatant","h": "Fine threads, hard to see."},{"w": "sustain","p": "verb","l": "medium","r": "Latin <b>sustinere</b> = <b>sub</b> (under) + <b>tenere</b> (to hold)","m": "To keep something going, or to suffer an injury.","s": "He sustained the pace for two miles.","syn": ["maintain","support"],"ant": "abandon","h": "You hold it up from underneath."},{"w": "viable","p": "adjective","l": "medium","r": "French <b>vie</b> (life), from Latin <b>vita</b>","m": "Workable; able to succeed or survive.","s": "That's the only viable route in winter.","syn": ["workable","practical"],"ant": "unworkable","h": "It has life in it."},{"w": "aberration","p": "noun","l": "hard","r": "Latin <b>aberrare</b> = <b>ab</b> (away) + <b>errare</b> (to wander)","m": "Something that departs from what is normal.","s": "The low score was an aberration, not a trend.","syn": ["anomaly","oddity"],"ant": "norm","h": "It wandered away from the usual."},{"w": "abhor","p": "verb","l": "hard","r": "Latin <b>abhorrere</b> (to shrink back from in horror)","m": "To hate deeply.","s": "He abhors waste of any kind.","syn": ["detest","loathe"],"ant": "adore","h": "Horror is inside the word."},{"w": "acquiesce","p": "verb","l": "hard","r": "Latin <b>acquiescere</b> (to rest, to agree)","m": "To accept something without protest.","s": "She acquiesced rather than argue again.","syn": ["consent","go along"],"ant": "resist","h": "You go quiet and let it happen."},{"w": "acrimonious","p": "adjective","l": "hard","r": "Latin <b>acrimonia</b> (sharpness, bitterness)","m": "Bitter and angry in tone.","s": "The meeting turned acrimonious.","syn": ["bitter","rancorous"],"ant": "amicable","h": "Sharp and sour, like acid."},{"w": "admonish","p": "verb","l": "hard","r": "Latin <b>admonere</b> (to warn, to remind)","m": "To warn or scold, usually mildly.","s": "The sergeant admonished them for being late.","syn": ["caution","reprove"],"ant": "praise","h": "A firm reminder with a warning attached."},{"w": "adroit","p": "adjective","l": "hard","r": "French <b>à droit</b> (rightly, properly)","m": "Skillful, especially with the hands or in handling situations.","s": "She was adroit at defusing arguments.","syn": ["deft","skillful"],"ant": "clumsy","h": "Doing it just right."},{"w": "affable","p": "adjective","l": "hard","r": "Latin <b>affabilis</b> (easy to speak to)","m": "Friendly and easy to talk to.","s": "The new supervisor is affable and direct.","syn": ["genial","approachable"],"ant": "aloof","h": "fable comes from speaking: easy to speak with."},{"w": "alacrity","p": "noun","l": "hard","r": "Latin <b>alacritas</b> (liveliness, eagerness)","m": "Cheerful willingness to act quickly.","s": "He accepted the assignment with alacrity.","syn": ["eagerness","readiness"],"ant": "reluctance","h": "You jump at it, happily."},{"w": "anomaly","p": "noun","l": "hard","r": "Greek <b>anomalos</b> (uneven, irregular)","m": "Something that doesn't fit the pattern.","s": "One reading was an anomaly.","syn": ["oddity","irregularity"],"ant": "norm","h": "It doesn't match the rest."},{"w": "antipathy","p": "noun","l": "hard","r": "Greek <b>anti</b> (against) + <b>pathos</b> (feeling)","m": "A strong dislike.","s": "There was clear antipathy between the two crews.","syn": ["aversion","hostility"],"ant": "fondness","h": "Feeling against. Compare sympathy and apathy."},{"w": "assiduous","p": "adjective","l": "hard","r": "Latin <b>assiduus</b> (sitting down to a task, persistent)","m": "Hardworking and careful over a long stretch.","s": "Her assiduous note-taking paid off.","syn": ["diligent","persistent"],"ant": "lax","h": "You sit down and stay with it."},{"w": "belligerent","p": "adjective","l": "hard","r": "Latin <b>bellum</b> (war) + <b>gerere</b> (to wage)","m": "Hostile and eager to fight.","s": "A belligerent customer was asked to leave.","syn": ["combative","aggressive"],"ant": "peaceable","h": "bellum means war, as in antebellum."},{"w": "brusque","p": "adjective","l": "hard","r": "Italian <b>brusco</b> (sharp, tart)","m": "Abrupt and short in manner.","s": "His brusque answer ended the conversation.","syn": ["curt","blunt"],"ant": "gracious","h": "Short and sharp, not rude exactly, but close."},{"w": "cacophony","p": n a preachy way.","s": "The film was didactic but useful.","syn": ["instructive","preachy"],"ant": "entertaining","h": "It's there to teach you a lesson."},{"w": "disparage","p": "verb","l": "hard","r": "Old French <b>desparagier</b> (to marry below one's rank, to lower)","m": "To speak of someone or something as unimportant.","s": "He disparaged the older equipment.","syn": ["belittle","put down"],"ant": "praise","h": "You lower how it's seen."},{"w": "disparate","p": "adjective","l": "hard","r": "Latin <b>disparatus</b> (separated, unequal)","m": "Very different from one another.","s": "The team came from disparate fields.","syn": ["dissimilar","varied"],"ant": "alike","h": "Not a pair: unequal and separate."},{"w": "dogmatic","p": "adjective","l": "hard","r": "Greek <b>dogma</b> (opinion, belief)","m": "Stating opinions as if they were proven facts.","s": "He was dogmatic about the one right method.","syn": ["opinionated","rigid"],"ant": "open-minded","h": "Their opinion is treated like law."},{"w": "ephemeral","p": "adjective","l": "hard","r": "Greek <b>ephemeros</b> (lasting only a day)","m": "Lasting a very short time.","s": "The applause was ephemeral.","syn": ["fleeting","short-lived"],"ant": "enduring","h": "Gone by tomorrow."},{"w": "equivocal","p": "adjective","l": "hard","r": "Latin <b>aequus</b> (equal) + <b>vocare</b> (to call)","m": "Deliberately unclear, so it can be taken two ways.","s": "His equivocal answer satisfied nobody.","syn": ["ambiguous","evasive"],"ant": "definite","h": "Two meanings with equal claim."},{"w": "exacerbate","p": "verb","l": "hard","r": "Latin <b>exacerbare</b> (to irritate, from <b>acerbus</b> harsh)","m": "To make a bad situation worse.","s": "Skipping maintenance exacerbated the leak.","syn": ["worsen","aggravate"],"ant": "relieve","h": "It makes things harsher."},{"w": "exemplary","p": "adjective","l": "hard","r": "Latin <b>exemplum</b> (example)","m": "So good it serves as a model.","s": "Her attendance was exemplary.", rgos</b> (drowsy, forgetful)","m": "Sluggish and low on energy.","s": "He felt lethargic after the long shift.","syn": ["sluggish","listless"],"ant": "energetic","h": "Heavy and slow."},{"w": "magnanimous","p": "adjective","l": "hard","r": "Latin <b>magnus</b> (great) + <b>animus</b> (spirit)","m": "Generous, especially toward a rival.","s": "She was magnanimous in victory.","syn": ["big-hearted","gracious"],"ant": "petty","h": "A great spirit about it."},{"w": "meager","p": "adjective","l": "hard","r": "Latin <b>macer</b> (thin, lean)","m": "Small and not enough.","s": "Despite his meager paycheck, he saved.","syn": ["scanty","sparse"],"ant": "plentiful","h": "Thin, with nothing spare."},{"w": "mundane","p": "adjective","l": "hard","r": "Latin <b>mundus</b> (world)","m": "Ordinary and everyday.","s": "Most of the job is mundane paperwork.","syn": ["routine","commonplace"],"ant": "extraordinary","h": "Of this world, nothing special."},{"w": "nefarious","p": "adjective","l": "hard","r": "Latin <b>nefas</b> (wrong, crime)","m": "Wicked; criminal.","s": "Nothing nefarious was found in the audit.","syn": ["villainous","evil"],"ant": "virtuous","h": "Against what's right."},{"w": "obfuscate","p": "verb","l": "hard","r": "Latin <b>obfuscare</b> (to darken, from <b>fuscus</b> dark)","m": "To make something confusing on purpose.","s": "The contract obfuscates the real cost.","syn": ["muddle","cloud"],"ant": "clarify","h": "You throw shade over it."},{"w": "ostentatious","p": "adjective","l": "hard","r": "Latin <b>ostentare</b> (to display, show off)","m": "Showy, meant to impress.","s": "The ostentatious watch drew stares.","syn": ["flashy","showy"],"ant": "understated","h": "Put on display for attention."},{"w": "placate","p": "verb","l": "hard","r": "Latin <b>placare</b> (to calm, to soothe)","m": "To calm someone's anger.","s": "A refund placated the customer.","syn": ["appease","pacify"],"ant": "enrage","h": "Same root as placid, meaning calm."},{"w": "precarious","p": arge.","syn": ["prove","verify"],"ant": "disprove","h": "You give the claim some substance."},{"w": "superfluous","p": "adjective","l": "hard","r": "Latin <b>super</b> (over) + <b>fluere</b> (to flow)","m": "More than is needed.","s": "Cut the superfluous steps from the checklist.","syn": ["unnecessary","excess"],"ant": "essential","h": "It overflows past what's needed."},{"w": "tacit","p": "adjective","l": "hard","r": "Latin <b>tacitus</b> (silent)","m": "Understood without being said out loud.","s": "There was tacit agreement to stay late.","syn": ["unspoken","implied"],"ant": "explicit","h": "Silent, but everybody knows."},{"w": "trivial","p": "adjective","l": "hard","r": "Latin <b>trivialis</b> (common, from the three-way crossroads where anyone might meet)","m": "Unimportant.","s": "Don't lose time on trivial edits.","syn": ["minor","insignificant"],"ant": "significant","h": "Common street-corner stuff, nothing important."},{"w": "zealous","p": "adjective","l": "hard","r": "Greek <b>zelos</b> (ardor, eager rivalry)","m": "Full of eager enthusiasm.","s": "He was zealous about the training plan.","syn": ["fervent","passionate"],"ant": "apathetic","h": "Zeal is fire behind what you do."},{"w": "tangible","p": "adjective","l": "medium","r": "Latin <b>tangere</b> (to touch)","m": "Real and definite; able to be touched.","s": "The training produced tangible results.","syn": ["concrete","real"],"ant": "abstract","h": "You can put your hand on it."},{"w": "vociferous","p": "adjective","l": "hard","r": "Latin <b>vox</b> (voice) + <b>ferre</b> (to carry)","m": "Loud and insistent in stating an opinion.","s": "Vociferous complaints reached the council.","syn": ["outspoken","clamorous"],"ant": "quiet","h": "Carrying your voice loudly. Same vox root as vocal."}];

  var KEY = "worddeck.marks.v1";

  var filter = "all", shuffled = false, order = WORDS.map(function(_,i){ return i; });

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function visible(){
    var list = order.filter(function(i){
      var w = WORDS[i];
      if(filter === "all") return true;
      if(filter === "review") return marks[w.w] === "again";
      return w.l === filter;
    });
    return list;
  }

  function highlight(sentence, word){
    var stem = word.length > 5 ? word.slice(0, word.length - 2) : word;
    var re = new RegExp("(" + stem + "\\w*)", "i");
    return esc(sentence).replace(re, "<em>$1</em>");
  }

          '<div class="blk"><p class="lab">Same &amp; opposite</p><div class="pair">' +
            w.syn.map(function(s){ return '<span class="tag s">= '+esc(s)+'</span>'; }).join("") +
            '<span class="tag a">&ne; '+esc(w.ant)+'</span></div></div>' +
          '<div class="blk"><p class="lab">Remember it</p><p class="hook">'+esc(w.h)+'</p></div>' +
          '<div class="marks"><button class="rev" data-mark="again" data-w="'+esc(w.w)+'">Review later</button>' +
          '<button class="got" data-mark="know" data-w="'+esc(w.w)+'">Got it</button></div>' +
        '</div>' +
      '</div></div></div>';
  }

  function render(keepTop){
    var list = visible();
    if(!list.length){
      feed.innerHTML = '<div class="slot"><div class="end"><h3>Nothing here yet</h3><p>Mark a few cards "Review later" and they\'ll show up in this pile.</p><button id="backAll">Back to all words</button></div></div>';
    } else {
      feed.innerHTML = list.map(cardHTML).join("") +
        '<div class="slot"><div class="end"><h3>Deck finished</h3><p>You went through '+list.length+' card'+(list.length===1?"":"s")+'. Run the review pile next, or shuffle and go again.</p><button id="again">Start over</button></div></div>';
    }
    if(!keepTop) feed.scrollTop = 0;
    updateCount();
  }

  function updateCount(){
    var known = WORDS.filter(function(w){ return marks[w.w] === "know"; }).length;
    document.getElementById("count").textContent = known + " of " + WORDS.length + " known";
    document.getElementById("bar").style.width = (known / WORDS.length * 100) + "%";
  }

  feed.addEventListener("click", function(e){
    var mk = e.target.closest("[data-mark]");
    if(mk){
      e.stopPropagation();
      var word = mk.dataset.w;
      marks[word] = marks[word] === mk.dataset.mark ? undefined : mk.dataset.mark;
      if(!marks[word]) delete marks[word];
      save(); updateCount();
      var card = mk.closest(".card");
      var badge = card.querySelector(".status");
      if(badge) badge.remove();
      if(marks[word]){
        var b = document.createElement("div");
        b.className = "status " + (marks[word] === "know" ? "know" : "again");
        b.textContent = marks[word] === "know" ? "Got it" : "Review";
        card.querySelector(".front").appendChild(b);
      }
      card.classList.remove("flipped");
      var slot = card.closest(".slot");
      if(slot.nextElementSibling) slot.nextElementSibling.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    if(e.target.id === "again" || e.target.id === "backAll"){
      if(e.target.id === "backAll") setFilter("all");
      else feed.scrollTo({top:0, behavior:"smooth"});
      return;
    }
    var card = e.target.closest(".card");
    if(card) card.classList.toggle("flipped");
  });

  feed.addEventListener("keydown", function(e){
    if((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")){
      e.preventDefault();
      e.target.classList.toggle("flipped");
    }
  });

  function setFilter(f){
    filter = f;
    document.querySelectorAll(".chip[data-f]").forEach(function(c){
      c.setAttribute("aria-pressed", String(c.dataset.f === f));
    });
    render();
  }

  document.getElementById("chips").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    if(chip.id === "shuffle"){
      shuffled = true;
      for(var i = order.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }
      render();
      return;
    }
    setFilter(chip.dataset.f);
  });

  render();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
